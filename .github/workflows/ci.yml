name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Home Assistant + test deps
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant pytest pytest-asyncio aiohttp yarl voluptuous

      - name: Run integration tests
        run: python -m pytest -v
